allprojects {
    ext {
        kotlin_version = "2.2.20"
        agpVersion = "8.13.0"
        compileSdkVersion = 36
        //targetSdkVersion = 24
        appCompatVersion = "1.6.1"
        lifeCycleRuntimeVersion = "2.7.0"
        lifeCycleExtensionsVersion = "2.2.0"
    }

    repositories {
        google()
        mavenCentral()
    }

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
// Two blocks, not one (as in Flutter's own template): every subproject's
// buildDir must be redirected BEFORE anything forces :app to evaluate. In one
// block, a plugin sorting before "app" (android_file_picker) evaluated :app
// with its default buildDir, the default R8 rules path went stale, and the
// release build failed on missing androidx.window classes.
// test/android_build_config_test.dart guards this.
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
